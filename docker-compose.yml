version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: securepay-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securepay-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./idempotent-payment-gateway
      dockerfile: Dockerfile
    container_name: securepay-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/postgres_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: SecurePaySecretKeyForJWTGenerationWhichMustBeAtLeast256BitsLong
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securepay-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
